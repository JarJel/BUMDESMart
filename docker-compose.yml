services:
  db:
    image: mariadb:11
    container_name: bumdesmart_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bumdesmart_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: dzakiawal24/bumdesmart-backend:latest
    container_name: bumdesmart_be
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/.env:/var/www/html/.env:ro
      - backend_storage:/var/www/html/storage
      - ./backend/app/Models/SiteVisit.php:/var/www/html/app/Models/SiteVisit.php:ro
      - ./backend/app/Http/Controllers/SiteVisitController.php:/var/www/html/app/Http/Controllers/SiteVisitController.php:ro
      - ./backend/app/Services/FcmService.php:/var/www/html/app/Services/FcmService.php:ro
      - ./backend/app/Models/FcmToken.php:/var/www/html/app/Models/FcmToken.php:ro
      - ./backend/app/Http/Controllers/FcmTokenController.php:/var/www/html/app/Http/Controllers/FcmTokenController.php:ro
      - ./backend/app/Helpers/PushNotification.php:/var/www/html/app/Helpers/PushNotification.php:ro
      - ./backend/app/Http/Controllers/PublicStatsController.php:/var/www/html/app/Http/Controllers/PublicStatsController.php:ro
      - ./backend/app/Models/Product.php:/var/www/html/app/Models/Product.php:ro
      - ./backend/app/Http/Controllers/Customers/ProductController.php:/var/www/html/app/Http/Controllers/Customers/ProductController.php:ro
      - ./backend/app/Http/Controllers/Customers/ProductSearchController.php:/var/www/html/app/Http/Controllers/Customers/ProductSearchController.php:ro
      - ./backend/app/Http/Controllers/Seller/SellerDiscountController.php:/var/www/html/app/Http/Controllers/Seller/SellerDiscountController.php:ro
      - ./backend/app/Services/ElasticsearchProductService.php:/var/www/html/app/Services/ElasticsearchProductService.php:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  queue:
    image: dzakiawal24/bumdesmart-backend:latest
    container_name: bumdesmart_queue
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./backend/.env:/var/www/html/.env:ro
      - backend_storage:/var/www/html/storage
      - ./backend/app/Models/SiteVisit.php:/var/www/html/app/Models/SiteVisit.php:ro
      - ./backend/app/Http/Controllers/SiteVisitController.php:/var/www/html/app/Http/Controllers/SiteVisitController.php:ro
      - ./backend/app/Services/FcmService.php:/var/www/html/app/Services/FcmService.php:ro
      - ./backend/app/Models/FcmToken.php:/var/www/html/app/Models/FcmToken.php:ro
      - ./backend/app/Http/Controllers/FcmTokenController.php:/var/www/html/app/Http/Controllers/FcmTokenController.php:ro
      - ./backend/app/Helpers/PushNotification.php:/var/www/html/app/Helpers/PushNotification.php:ro
      - ./backend/app/Http/Controllers/PublicStatsController.php:/var/www/html/app/Http/Controllers/PublicStatsController.php:ro
      - ./backend/app/Models/Product.php:/var/www/html/app/Models/Product.php:ro
      - ./backend/app/Http/Controllers/Customers/ProductController.php:/var/www/html/app/Http/Controllers/Customers/ProductController.php:ro
      - ./backend/app/Http/Controllers/Customers/ProductSearchController.php:/var/www/html/app/Http/Controllers/Customers/ProductSearchController.php:ro
      - ./backend/app/Http/Controllers/Seller/SellerDiscountController.php:/var/www/html/app/Http/Controllers/Seller/SellerDiscountController.php:ro
      - ./backend/app/Services/ElasticsearchProductService.php:/var/www/html/app/Services/ElasticsearchProductService.php:ro
    entrypoint: []
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=60

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
        NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY}
        NEXT_PUBLIC_MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_WHATSAPP_GATEWAY_ENABLED: ${NEXT_PUBLIC_WHATSAPP_GATEWAY_ENABLED:-false}
    container_name: bumdesmart_fe
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: bumdesmart_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: bumdesmart_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run
    dns:
      - 192.168.101.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - caddy

  openwa:
    image: ghcr.io/rmyndharis/openwa:latest
    container_name: bumdesmart_openwa
    restart: unless-stopped
    shm_size: '2gb'
    environment:
      - PORT=2785
      - AUTO_START_SESSIONS=true
      - NODE_ENV=production
    volumes:
      - openwa_data:/app/sessions
    ports:
      - "2785:2785"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:2785/api/sessions || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  db_data:
  redis_data:
  backend_storage:
  caddy_data:
  caddy_config:
  openwa_data:
